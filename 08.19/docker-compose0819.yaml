services:
  # =========================================================
  # FastAPI
  # =========================================================
  my-app:
    build:
      context: ./fastapi
      dockerfile: Dockerfile
    container_name: my-app
    restart: unless-stopped

    environment:
      DB_HOST: std20-linux-mysql.c1aieog4upxq.ap-east-1.rds.amazonaws.com
      DB_PORT: 3306
      DB_USER: std20
      DB_PASSWORD: melt7542
      DB_NAME: STUDY
      DB_TIMEOUT: 5

    expose:
      - "8000"

    networks:
      - backend

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s


  # =========================================================
  # Nginx
  # =========================================================
  my-web:
    build:
      context: ./nginx
      dockerfile: Dockerfile

    container_name: my-web
    restart: unless-stopped

    depends_on:
      my-app:
        condition: service_healthy

    ports:
      - "80:80"

    networks:
      - frontend
      - backend


# ===========================================================
# Networks
# ===========================================================
networks:
  frontend:
    driver: bridge

  backend:
    driver: bridge
