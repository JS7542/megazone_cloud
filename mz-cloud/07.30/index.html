<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MySQL 연결 테스트</title>

    <style>
        body {
            margin: 0;
            padding: 50px 20px;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #333;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            color: #232f3e;
        }

        p {
            line-height: 1.7;
            color: #555;
        }

        button {
            margin-top: 20px;
            padding: 14px 24px;
            border: none;
            border-radius: 7px;
            background: #ff9900;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #e68a00;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #result {
            display: none;
            margin-top: 25px;
            padding: 18px;
            border-radius: 7px;
            line-height: 1.7;
            white-space: pre-line;
        }

        #result.loading {
            display: block;
            background: #fff4cf;
            color: #6b4d00;
        }

        #result.success {
            display: block;
            background: #eaf8ee;
            color: #126b2e;
        }

        #result.error {
            display: block;
            background: #fdecec;
            color: #9b1c1c;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>nginx 웹 서버</h1>

        <p>
            아래 버튼을 누르면 FastAPI를 통해
            로컬 MySQL 데이터베이스 연결을 확인합니다.
        </p>

        <button id="dbButton" type="button">
            데이터베이스 연결 테스트
        </button>

        <div id="result"></div>
    </main>

    <script>
        const dbButton = document.getElementById("dbButton");
        const result = document.getElementById("result");

        dbButton.addEventListener("click", async () => {
            dbButton.disabled = true;
            dbButton.textContent = "연결 확인 중...";

            result.className = "loading";
            result.textContent = "MySQL 연결을 확인하고 있습니다.";

            try {
                const response = await fetch("/api/db-test");
                const data = await response.json();

                if (!response.ok || data.status !== "Success") {
                    throw new Error(
                        data.error ||
                        data.message ||
                        `HTTP ${response.status}`
                    );
                }

                result.className = "success";
                result.textContent =
                    "데이터베이스 연결 성공\n" +
                    "DB 이름: " + data.database + "\n" +
                    "MySQL 버전: " + data.version;

            } catch (error) {
                result.className = "error";
                result.textContent =
                    "데이터베이스 연결 실패\n" +
                    error.message;

            } finally {
                dbButton.disabled = false;
                dbButton.textContent = "데이터베이스 연결 테스트";
            }
        });
    </script>
</body>
</html>
