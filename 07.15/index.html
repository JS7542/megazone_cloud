<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>megazone 실기 평가</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 40px; }
        .container { max-width: 1000px; margin: auto; }
        h1 { text-align: center; color: #333; margin-bottom: 40px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
        .docker { border-top: 5px solid #007bff; }
        .ubuntu { border-top: 5px solid #ff9900; }
        .secrets { border-top: 5px solid #232f3e; }
        h2 { margin-top: 0; }
    </style>
</head>
