
# 서비스 설정
services:
  my-db:
    image: smile1101/mynginx:mysql 
    pull_policy: if_not_present
    build:
      context: ../build/mysql   #Dockerfile 경로
      dockerfile: Dockerfile    #Dockerfile 이름
    container_name: my_db
    environment:
      MYSQL_ROOT_PASSWORD: "melt7542"
      MYSQL_DATABASE: "testdb"
    ports:
      - "3306:3306"
     
    networks:
      - backend-net
    volumes:
      - shared-data:/var/log/mysql
      
     
# 네트워크 설정
networks:
  backend-net:
    driver: bridge
    ipam:  #네트워크 상세 설정
      config:
        - subnet: 172.16.1.0/24
          ip_range: 172.16.1.0/24
          gateway: 172.16.1.1
    
# 불륨 설정
volumes:
  shared-data:
    driver: local # local | efs | ...
    driver_opts:
      type: "none"
      o: "bind"
      device: "/home/ubuntu/logs/mysql"